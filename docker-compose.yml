version: '3.9'

services:

  # ── Spring Boot API ───────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kokkiligadda-api
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      # Set MONGODB_URI in your environment or .env file
      SPRING_DATA_MONGODB_URI: ${MONGODB_URI}
      SERVER_PORT: 9000
    networks:
      - kokkiligadda-net

  # ── Node.js Proxy (server.js) ─────────────────────────────────────────────────
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: kokkiligadda-proxy
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      SPRING_BASE: http://api:9000/api/family-members
    depends_on:
      - api
    networks:
      - kokkiligadda-net

networks:
  kokkiligadda-net:
    driver: bridge
